<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hexblast 逐帧特效检查</title>
<style>
body{margin:0;padding:28px;background:#111827;color:#e2eaf5;font:15px system-ui}header,main{max-width:1150px;margin:auto}h1{font-size:25px}p{color:#afbed1}nav{display:flex;gap:18px;align-items:center;margin:22px 0;flex-wrap:wrap}button,select,a{color:#e2eaf5}button,select{background:#27374e;border:1px solid #64748b;border-radius:6px;padding:9px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}article{background:#1b273a;border:1px solid #3b506b;border-radius:10px;padding:16px}h2{font-size:18px;margin:0 0 8px}canvas{width:100%;background:repeating-conic-gradient(#2d3a50 0 25%,#263247 0 50%) 0/24px 24px;border-radius:8px}.caption{font:12px monospace;min-height:36px;margin:10px 0 0}
</style>
<header><h1>逐帧特效检查</h1><p>上方按 180px 放大检查，下方按 64px 显示；青色十字为固定发射点。序列结束后空置半秒再重播。制作稿仍需战斗内验收。</p><nav><a href="preview.html">角色动作</a><button id="pause">暂停</button><button id="first" disabled>首帧</button><button id="step">下一帧</button><label>背景 <select id="bg"><option value="dark">深色</option><option value="light">浅色</option></select></label><label><input id="marks" type="checkbox" checked>显示发射点</label></nav><p id="status">正在载入…</p></header>
<main></main>
<script>
const $=id=>document.getElementById(id), names={fx_weapon_cyan:'等离子枪口',fx_weapon_charged:'强化炮击枪口',fx_explosion:'爆炸',fx_weapon_ice:'冰霜枪口',fx_cold_arrow:'寒冰命中',fx_enemy_claw_slash:'爪击',fx_heal:'治疗',fx_frost_aura:'冰场展开',fx_weapon_chaos:'混沌掌击',fx_weapon_time:'时间枪口',fx_time_blade:'时间刃',fx_chaos_pulse:'混沌脉冲',fx_weapon_toxic:'毒镖枪口',fx_toxic_impact:'毒镖命中',fx_poison:'毒雾',fx_shield_break:'护盾碎裂'};
let entries=[],images={},running=true,last=0;
async function init(){const db=await(await fetch('preview-effects.json')).json();for(const [key,clip]of Object.entries(db)){if(!images[clip.sheet]){const img=new Image();img.src='../../../assets/resources/art/'+clip.sheet+'.png';await img.decode();images[clip.sheet]=img}const article=document.createElement('article');article.innerHTML=`<h2>${names[key]||key}</h2><canvas width="300" height="280"></canvas><div class="caption"></div>`;document.querySelector('main').append(article);entries.push({key,clip,article,frame:0,elapsed:0,hold:0})}$('status').textContent=`已载入 ${entries.length} 个真实绘制的特效序列`;$('first').disabled=false;requestAnimationFrame(tick)}
function draw(){for(const e of entries){const canvas=e.article.querySelector('canvas'),ctx=canvas.getContext('2d'),f=e.clip.frames[e.frame],img=images[e.clip.sheet],w=img.width/e.clip.columns,h=img.height/e.clip.rows;ctx.clearRect(0,0,300,280);if($('bg').value==='light'){ctx.fillStyle='#ebedf0';ctx.fillRect(0,0,300,280)}for(const [size,x,y]of [[180,130,104],[64,138,233]]){ctx.save();ctx.translate(x,y);if(!e.hold)ctx.drawImage(img,f.index%e.clip.columns*w,Math.floor(f.index/e.clip.columns)*h,w,h,-f.pivot[0]*size,-f.pivot[1]*size,size,size);if($('marks').checked){ctx.strokeStyle='#38dcd9';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.stroke()}ctx.restore()}e.article.querySelector('.caption').textContent=`${e.frame+1}/${e.clip.frames.length} · ${e.clip.sheet} · ${f.seconds}s${e.hold?' · 重播间隔':''}`}}
function tick(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(running)for(const e of entries){if(e.hold){e.hold=Math.max(0,e.hold-dt);if(!e.hold)e.frame=0;continue}e.elapsed+=dt;while(e.elapsed>=e.clip.frames[e.frame].seconds){e.elapsed-=e.clip.frames[e.frame].seconds;if(e.frame+1<e.clip.frames.length)e.frame++;else{e.hold=.5;e.elapsed=0;break}}}draw();requestAnimationFrame(tick)}
$('first').onclick=()=>{running=false;$('pause').textContent='播放';for(const e of entries){e.frame=0;e.elapsed=0;e.hold=0}draw()};$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'暂停':'播放'};$('step').onclick=()=>{running=false;$('pause').textContent='播放';for(const e of entries){e.hold=0;e.frame=(e.frame+1)%e.clip.frames.length;e.elapsed=0}draw()};init().catch(error=>$('status').textContent=error.message);
</script></html>
