<!doctype html><html lang="zh"><meta charset="utf-8"><title>37种敌人身体动作验收</title>
<style>body{min-width:1280px;margin:0;background:#14202c;color:#eef7ff;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#14202c;z-index:2}button,select{padding:8px;background:#29445a;color:inherit;border:1px solid #8099aa}iframe{border:0;width:1280px;height:720px}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}figure{margin:0}figure img{width:100%}pre{white-space:pre-wrap}</style>
<header><button id="all">全部37种验收</button><select id="unit" aria-label="单位"></select><button id="one">单个复测</button><button id="sizes">同屏体形比较</button><button id="movement">移动诊断</button><button id="identities">重点首领对比</button><span id="status">载入中</span></header>
<iframe id="game" src="/game/"></iframe><div id="gallery"></div><pre id="report"></pre>
<script>
const statusEl=document.querySelector('#status'),delay=ms=>new Promise(r=>setTimeout(r,ms));
let g,db,coverage,results=[];
const ready=(async()=>{[db,coverage]=await Promise.all(['/animation-data.json','/coverage.json'].map(p=>fetch(p).then(r=>r.json())));for(const u of coverage)unit.add(new Option(u.id,u.id));statusEl.textContent='等待游戏载入';})();
async function save(name,report,image){const r=await fetch('/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(image?{name,image}:{name,report})});if(!r.ok)throw Error('保存失败 '+name);}
async function prepare(id){game.style.display="block";await ready;const w=game.contentWindow;for(let i=0;i<150&&!w.cc?.director?.getScene()?.getChildByName('Canvas')?.getChildByName('GameRoot');i++)await delay(100);g=w.cc.director.getScene().getChildByName('Canvas').getChildByName('GameRoot').getComponent('GameManager');if(g.state!=='testRoom')g._startTestRoom();g.enabled=false;g.input.setStick(0,0);g.input._keys.clear();g.clearTestField();g._testTargetPaused=false;g.testCeasefire=true;g._player.godMode=true;g._player.hp=g._player.maxHp=100000;g._player.x=880;g._player.y=330;g._player.stats.damage=0;g.spawnTestUnit(id==='boss_invader_final'?'boss_invader':id,1);const e=g._enemies[0];e.x=520;e.y=330;e.hp=e.maxHp=1000000;if(id==='boss_invader_final'){e.finalForm=true;e._invFormT=0;}const expected=coverage.find(u=>u.id===id);if(e.animationSpriteKey!==expected.key)throw Error('生成身份错误 '+id+' 实际 '+e.animationSpriteKey+' 预期 '+expected.key);g._floatText.clear();g._renderFrame();return e;}
// 后台浏览器会节流 RAF；用引擎公开 tick 驱动真实渲染，每一帧仍检查 SpriteFrame 和截图。
const drawn=()=>new Promise(r=>{const director=game.contentWindow.cc.director;director.once('director_after_draw',r);director.tick(0);});
async function pose(e,clip,action,view,index,mirror=1){e.actorAnimation.reset();e.actorAnimation.play(action,clip);e.actorAnimation.seekFrame(index);e.animationView=view;e.animationMirror=mirror;g._renderFrame();for(let n=0;n<100&&!e.sprite?.spriteFrame;n++){await delay(40);g._renderFrame();}await drawn();const sf=e.sprite?.spriteFrame,f=clip.frames[index];if(!sf||Math.abs(sf.rect.width-256)>.1||sf.rect.x!==(f.index%8)*256||sf.rect.y!==Math.floor(f.index/8)*256)throw Error('图集未正确加载 '+clip.sheet+' '+index);}
function crop(e,width=230,height=230){const src=game.contentDocument.querySelector('canvas'),dst=document.createElement('canvas');dst.width=width;dst.height=height;dst.getContext('2d').drawImage(src,(e.x-width/2)*src.width/1280,(e.y-height/2)*src.height/720,width*src.width/1280,height*src.height/720,0,0,width,height);return dst;}
function galleryImage(title,image){const f=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src=image;cap.textContent=title;f.append(im,cap);gallery.append(f);}
// 用正式地图碰撞 API 找完整直线通道，避免把随机残骸内的无效测试出生点误判成 AI 停滞。
function movementLane(radius){for(const y of [170,220,370,420,120,470,270,320])for(const x of [240,320,160,400]){let at={x,y},ok=true;for(let n=0;n<58;n++){const next=g.moveInArena(at.x,at.y,10,0,Math.max(radius,g._player.radius));if(Math.abs(next.x-at.x-10)>.01||Math.abs(next.y-at.y)>.01){ok=false;break;}at=next;}if(ok)return {x,y};}throw Error('地图中未找到合法的580px测试通道 '+g._arena.id);}
async function movementCheck(id){const samples=[];for(const gap of [180,580]){const e=await prepare(id);const lane=movementLane(e.radius);g._player.x=lane.x+580;g._player.y=lane.y;e.x=g._player.x-gap;e.y=lane.y;const before=Math.hypot(e.x-g._player.x,e.y-g._player.y);for(let n=0;n<24;n++)g._updatePlaying(1/60);const after=Math.hypot(e.x-g._player.x,e.y-g._player.y);samples.push({gap,before,after,delta:after-before,arena:g._arena.id,enemy:[e.x,e.y,e.radius,e.alive,e.speed],player:[g._player.x,g._player.y],paused:g._testTargetPaused,deathPending:g._playerDeathPending});await save("movement-diagnostic",{id,samples});if(id!=='gold_scavenger'&&gap===580&&after>=before-.1)throw Error('远处未接近 '+id+' '+(after-before));if(!['gold_scavenger','archer','needle_gunner'].includes(id)&&gap===180&&after>before+1)throw Error('非拉扯单位后撤 '+id+' '+(after-before));}return samples;}
async function inspect(id){statusEl.textContent='检查 '+id;const u=coverage.find(u=>u.id===id),e=await prepare(id),set=db[u.key];const sheet=document.createElement('canvas');sheet.width=230*4;sheet.height=230*3;const ctx=sheet.getContext('2d');let checked=0;const actions=[];for(const [vi,view]of ['front','side','back'].entries())for(const [action,clip]of Object.entries(set[view])){const seen=[];for(let frame=0;frame<clip.frames.length;frame++){await pose(e,clip,action,view,frame);seen.push(e.sprite.spriteFrame.rect.x+','+e.sprite.spriteFrame.rect.y);checked++;if((action==='idle'&&frame===0)||(action==='walk'&&frame===2)||(action==='attack'&&frame===4)||(action==='defeated'&&frame===7)){const col={idle:0,walk:1,attack:2,defeated:3}[action];ctx.drawImage(crop(e),col*230,vi*230);ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.fillText(view+' '+action,col*230+8,vi*230+20);}}if(new Set(seen).size!==8)throw Error('帧重复 '+id+'/'+action);actions.push(view+'/'+action);}await pose(e,set.side.attack,'attack','side',4,-1);const image=sheet.toDataURL();await save(id+'-poses',null,image);galleryImage(id+' 三方向 / 待机、步行、攻击、倒下',image);
// 正式AI与表现时钟联动：追踪移动、冻结、攻击和技能状态，不用图集播放代替实战。
const movement=await movementCheck(id);const live=await prepare(id);live._skillTimer=.15;live._rangedCd=.15;live._miniTimer=.15;live._miniCd1=.15;live.docSkillTimer=.15;live._invLaserCd=.15;live._invMissileCd=.4;live._invHomingCd=.7;let distance=0,last=[live.x,live.y];const aiActions=new Set();for(let n=0;n<600;n++){if(!live.alive)break;if(n===210){g._player.x=live.x+live.radius+24;g._player.y=live.y;}if(n===360){g._player.x=880;g._player.y=420;}g._updatePlaying(1/60);g._visualTime+=1/60;distance+=Math.hypot(live.x-last[0],live.y-last[1]);last=[live.x,live.y];aiActions.add(live.actorAnimation.action);if(n%60===0){g._renderFrame();await delay(20);}}g._renderFrame();await delay(100);await drawn();await save(id+'-live',null,crop(live,360,300).toDataURL());if(!live.actorAnimation.clip?.sheet.startsWith('anim_stylea_'))throw Error('AI返回旧身体 '+id);const result={id,actualArtKey:live.animationSpriteKey,movement,category:u.category,framesChecked:checked,views:3,actions,mirrorChecked:true,visibleExtent:u.visibleExtent,aiMaxSeconds:10,movementPixels:+distance.toFixed(2),aiActions:[...aiActions],pass:true};await save(id,result);statusEl.textContent='通过 '+id+'，'+checked+'帧';return result;}
async function run(ids){gallery.innerHTML='';results=[];try{for(const id of ids){if(results.length>0&&results.length%6===0){await new Promise(resolve=>{game.onload=resolve;game.src='/game/?batch='+results.length;});await delay(600);}const r=await inspect(id);results.push(r);report.textContent=JSON.stringify(results,null,2);await save('summary',{date:new Date().toISOString(),units:results,complete:results.length===38});}statusEl.textContent='完成 '+results.length+' 个形态（37种敌人＋终形）';game.style.display='none';}catch(err){statusEl.textContent='失败：'+err.message;await save('failure',{message:err.message,stack:err.stack,results});throw err;}}
movement.onclick=async()=>{const checks=[];try{for(const u of coverage){checks.push({id:u.id,samples:await movementCheck(u.id)});}await save('movement-all',{checks,complete:true});report.textContent=JSON.stringify(checks,null,2);statusEl.textContent='移动检查全部通过 '+checks.length;}catch(err){statusEl.textContent=err.message;await save('movement-failure',{checks,error:err.message});}};
all.onclick=()=>run(coverage.map(u=>u.id));one.onclick=()=>run([unit.value]);
sizes.onclick=async()=>{await prepare('grunt');g.clearTestField();g._arena={...g._arena,obstacles:[]};g._drawArenaProps();const ids=['grunt','golem','miniboss','drone_a','squid','bell_devourer','boss_ch1','boss_invader'];for(let i=0;i<ids.length;i++){g.spawnTestUnit(ids[i],1);const e=g._enemies[g._enemies.length-1];e.x=110+i*145;e.y=360;const u=coverage.find(u=>u.id===ids[i]);await pose(e,db[u.key].front.idle,'idle','front',0);}g._player.x=640;g._player.y=520;g._floatText.clear();g._renderFrame();await drawn();const image=game.contentDocument.querySelector('canvas').toDataURL();await save('size-comparison',null,image);game.style.display='block';statusEl.textContent='同屏体形比较：小兵3种 / 小Boss3种 / 首领2种';};
identities.onclick=async()=>{await prepare('boss_ch1');g.clearTestField();g._arena={...g._arena,obstacles:[]};g._drawArenaProps();const ids=['boss_ch1','boss_ch2','boss_vespa','boss_crucible_city','boss_manyfold'];const labels=[];for(let i=0;i<ids.length;i++){g.spawnTestUnit(ids[i],1);const e=g._enemies[g._enemies.length-1],u=coverage.find(u=>u.id===ids[i]);if(e.animationSpriteKey!==u.key)throw Error('身份错误 '+ids[i]);e.x=140+i*250;e.y=375;await pose(e,db[u.key].front.idle,'idle','front',0);labels.push([e.x,e.label]);}g._floatText.clear();for(const[x,name]of labels)g._floatText.spawn(x,240,name,'#d8e9ff',15,true);g._player.x=640;g._player.y=540;g._renderFrame();await drawn();await save('identity-comparison',null,game.contentDocument.querySelector('canvas').toDataURL());statusEl.textContent='已核对5种首领真实身份与轮廓';};
game.onload=()=>statusEl.textContent='游戏已载入，可开始验收';
</script></html>
