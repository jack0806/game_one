<!doctype html><html lang="zh"><meta charset="utf-8"><title>近身阻挡与滑动验收</title>
<style>body{margin:0;background:#14202c;color:#eaf4ff;font:15px system-ui;min-width:1280px}header{padding:12px;position:sticky;top:0;background:#14202c;display:flex;gap:16px;z-index:2}button{padding:8px 16px}iframe{width:1280px;height:720px;border:0}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}figure{margin:0}img{width:100%}pre{white-space:pre-wrap}</style>
<header><button id="run">全量碰撞验收</button><button id="demo">观看近身与绕行</button><span id="status">等待游戏载入</span></header>
<iframe id="game" src="/game/"></iframe><div id="gallery"></div><pre id="report"></pre>
<script>
const delay=ms=>new Promise(r=>setTimeout(r,ms)),statusEl=document.querySelector('#status');let g,units,results=[];
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),contact=e=>g._player.radius+e.radius*(e.isBoss?1.15:1)+3;
async function save(name,report,image){const r=await fetch('/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(image?{name:'collision-'+name,image}:{name:'collision-'+name,report})});assert(r.ok,'证据保存失败');}
async function draw(){g._renderFrame();const d=game.contentWindow.cc.director;await new Promise(r=>{d.once('director_after_draw',r);d.tick(0);});}
async function init(){units??=await fetch('/coverage.json').then(r=>r.json());const w=game.contentWindow;for(let n=0;n<150&&!w.cc?.director?.getScene()?.getChildByName('Canvas')?.getChildByName('GameRoot');n++)await delay(100);g=w.cc.director.getScene().getChildByName('Canvas').getChildByName('GameRoot').getComponent('GameManager');if(g.state!=='testRoom')g._startTestRoom();g.enabled=false;g._arena={...g._arena,obstacles:[]};g._drawArenaProps();}
async function prepare(id){await init();g.clearTestField();g.input.setStick(0,0);g.input._keys.clear();g.testCeasefire=true;g._testTargetPaused=true;const p=g._player;p.godMode=true;p.hp=p.maxHp=100000;p.stats.damage=0;p.stats.speed=180;p.x=390;p.y=330;g.spawnTestUnit(id,1);const e=g._enemies[0];e.x=700;e.y=330;e.hp=e.maxHp=1000000;g._floatText.clear();await draw();for(let n=0;n<100&&!e.sprite?.spriteFrame;n++){await delay(40);await draw();}return e;}
function tick(n){for(let i=0;i<n;i++){g._updatePlaying(1/60);g._visualTime+=1/60;}}
function screenshot(){return game.contentDocument.querySelector('canvas').toDataURL();}
function crop(){const src=game.contentDocument.querySelector('canvas'),out=document.createElement('canvas');out.width=420;out.height=260;out.getContext('2d').drawImage(src,420*src.width/1280,190*src.height/720,420*src.width/1280,260*src.height/720,0,0,420,260);return out.toDataURL();}
async function record(result){results.push(result);report.textContent=JSON.stringify(results,null,2);await save('results',{complete:false,results});}
run.onclick=async()=>{run.disabled=true;demo.disabled=true;results=[];gallery.innerHTML='';try{
await init();for(const u of units.filter(u=>u.id!=='boss_invader_final')){statusEl.textContent='持续顶住 '+u.id;const e=await prepare(u.id),before={x:e.x,y:e.y};g.input.setStick(1,0);tick(240);g.input.setStick(0,0);const gap=dist(g._player,e);assert(dist(before,e)<.001,u.id+' 被英雄推走');assert(gap>=contact(e)-.02&&gap<=contact(e)+.6,u.id+' 接触间距错误 '+gap);await draw();const image=crop();await save(u.id,null,image);const f=document.createElement('figure');f.innerHTML='<img><figcaption></figcaption>';f.querySelector('img').src=image;f.querySelector('figcaption').textContent=e.label+'：顶住4秒，敌人位移0';gallery.append(f);await record({case:'hero-approach',id:u.id,enemyMovement:dist(before,e),gap,pass:true});}
for(const id of ['grunt','golem','boss_ch1','boss_ch2']){statusEl.textContent='主动追近 '+id;const e=await prepare(id);g._testTargetPaused=false;g._player.x=800;e.x=650;e._skillTimer=e._summonTimer=e._chargeCd=999;g._player.godMode=false;const before={x:g._player.x,y:g._player.y};tick(360);assert(dist(before,g._player)<.001,id+' 挤动英雄');assert(dist(g._player,e)>=contact(e)-.02,id+' 穿入英雄');assert(g._player.hp<100000,id+' 贴身无法攻击');await record({case:'enemy-approach',id,heroMovement:dist(before,g._player),damage:100000-g._player.hp,pass:true});}
let e=await prepare('boss_ch2');g._player.x=e.x-contact(e);g.input.setStick(.707,-.707);tick(90);g.input.setStick(0,0);assert(g._player.x>720&&g._player.y<260,'斜向不能绕过首领');assert(e.x===700&&e.y===330,'斜绕推动首领');await record({case:'diagonal-slide',pass:true,hero:[g._player.x,g._player.y]});
e=await prepare('grunt');g._player.x=800;e.x=800-contact(e);e.frozen=100;g.spawnTestUnit('grunt',1);const rear=g._enemies[1];rear.x=e.x-70;rear.y=e.y;g._testTargetPaused=false;tick(180);assert(e.x===800-contact(e)&&e.y===330,'后排推动前排');assert(Math.abs(rear.y-e.y)>20,'后排未绕行');assert(g._player.x===800,'群怪挤动英雄');await draw();await save('crowd',null,screenshot());await record({case:'crowd-side-step',rear:[rear.x,rear.y],pass:true});
e=await prepare('grunt');g._player.x=700-contact(e);g.input.setStick(1,0);g._hitStop.trigger(200);for(let n=0;n<8;n++)g.update(1/60);g.input.setStick(0,0);assert(e.x===700,'打击停顿期间推动敌人');await record({case:'hit-stop',pass:true});
await save('results',{complete:true,date:new Date().toISOString(),results});statusEl.textContent='全部通过：37种顶住不推动、主动追近、斜绕、群怪、打击停顿';
}catch(err){statusEl.textContent='失败：'+err.message;await save('failure',{error:err.message,stack:err.stack,results});}finally{run.disabled=false;demo.disabled=false;}};
demo.onclick=async()=>{demo.disabled=true;const e=await prepare('boss_ch2');g._player.x=550;statusEl.textContent='演示：直走被阻挡，然后沿首领边缘绕行';g.input.setStick(1,0);for(let n=0;n<150;n++){tick(1);await draw();await delay(16);}await save('blocked',null,screenshot());g.input.setStick(.707,-.707);for(let n=0;n<100;n++){tick(1);await draw();await delay(16);}g.input.setStick(0,0);await save('slide',null,screenshot());statusEl.textContent='演示完成：首领位置始终不变，英雄沿边缘绕过';demo.disabled=false;};
</script></html>
